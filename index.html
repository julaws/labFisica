<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="color-scheme" content="dark" />
    <title>Laboratório Didático de Física · experimentos interativos em 3D</title>
    <meta
      name="description"
      content="Oito experimentos de física em 3D, direto no navegador: lentes e foco, dupla fenda, força magnética, tunelamento quântico, buraco negro, figuras de Chladni, batimentos e foguete. Mexa nos controles, veja a física acontecer e deixe a curiosidade pela ciência despertar."

    <meta property="og:site_name" content="Laboratório Didático de Física" />
    <meta property="og:title" content="Laboratório Didático de Física · experimentos interativos em 3D" />
    <meta
      property="og:description"
      content="Experimentos de física em 3D para mexer e descobrir: de lentes e buracos negros a ondas sonoras e foguetes, com a física calculada de verdade. Um convite para se encantar pela ciência."
    />
    <meta property="og:image" content="https://julaws.github.io/labFisica/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

  <body>
    <div id="app">
      <canvas id="scene" aria-label="Cena 3D do laboratório de física" role="img"></canvas>

      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="loading__card">
          <p class="loading__title">Laboratório Didático de Física</p>
          <p class="loading__step">Polindo o vidro…</p>
          <div class="loading__bar"><div class="loading__fill" style="width: 0%"></div></div>
